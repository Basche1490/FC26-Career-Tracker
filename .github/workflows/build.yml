name: Build APK

# Every push builds the app, runs the unit tests and uploads the APK as an artifact.
# Pushes to "main" also publish it on the repository's Releases page as "Latest build", which is the
# easiest place to download it from your phone:  Releases -> Latest build -> app-release.apk
#
# You can also start a build by hand: Actions -> Build APK -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper is committed, so install the Gradle version that Android Gradle Plugin 9.1 needs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Unit tests
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:testDebugUnitTest > test.log 2>&1
          code=$?
          tail -n 40 test.log
          if [ $code -ne 0 ]; then
            { grep -E "^e: " test.log | head -150; grep -n -E "FAILED|AssertionError|Exception:" test.log | head -40; grep -n -A 14 "What went wrong" test.log | head -30; } > errors.txt
            python3 - <<'PY'
          t = open("errors.txt", encoding="utf-8", errors="replace").read()
          t = t.replace("file:///home/runner/work/FC26-Career-Tracker/FC26-Career-Tracker/app/src/", "").replace("main/java/com/fctracker/career/", "").replace("test/java/com/fctracker/career/", "test:")
          chunks = [t[i:i + 3500] for i in range(0, min(len(t), 31500), 3500)] or ["(no details)"]
          for n, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Unit tests failed ({n + 1}/{len(chunks)})::" + c)
          PY
          fi
          exit $code

      - name: Build APK
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleRelease > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            { grep -E "^e: " build.log | head -150; grep -n -A 14 "What went wrong" build.log | head -30; tail -n 15 build.log; } > errors.txt
            python3 - <<'PY'
          t = open("errors.txt", encoding="utf-8", errors="replace").read()
          t = t.replace("file:///home/runner/work/FC26-Career-Tracker/FC26-Career-Tracker/app/src/", "").replace("main/java/com/fctracker/career/", "")
          chunks = [t[i:i + 3500] for i in range(0, min(len(t), 31500), 3500)] or ["(no details)"]
          for n, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Gradle build failed ({n + 1}/{len(chunks)})::" + c)
          PY
          fi
          exit $code

      # The PC side in one download: the launcher, the bridge and the two Live Editor scripts. No top-level folder,
      # so "Extract All" gives one folder that holds FC26_Launcher.bat directly.
      - name: Package PC tools
        run: |
          python3 - <<'PY'
          import os, zipfile
          files = ["FC26_Launcher.bat", "docs/PC_SETUP.md", "docs/SECURITY.md"]
          for folder in ("pc-bridge", "live-editor-scripts"):
              for base, dirs, names in os.walk(folder):
                  dirs[:] = [d for d in dirs if d != "__pycache__"]
                  files += [os.path.join(base, n).replace(os.sep, "/") for n in names if not n.endswith((".pyc", ".json", ".log"))]
          with zipfile.ZipFile("FC26-PC-Tools.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for f in sorted(files):
                  z.write(f, f[len("docs/"):] if f.startswith("docs/") else f)
          print(len(files), "files in FC26-PC-Tools.zip")
          PY
          unzip -l FC26-PC-Tools.zip

      # The SHA-256 of both downloads, so a download can be checked (docs/SECURITY.md, "Checking the downloads").
      - name: Checksums
        run: |
          cp app/build/outputs/apk/release/app-release.apk FC26-Career-Tracker.apk
          sha256sum FC26-Career-Tracker.apk FC26-PC-Tools.zip | tee SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FC26-Career-Tracker-apk
          path: |
            app/build/outputs/apk/release/*.apk
            FC26-PC-Tools.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish "Latest build" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sums="$(sed 's/^/    /' SHA256SUMS.txt)"
          printf '%s\n\n%s\n\n%s\n' \
            "Automatic build of commit ${GITHUB_SHA::7} (build #${GITHUB_RUN_NUMBER}). FC26-Career-Tracker.apk is the phone app: install it over the previous version, your data is kept. FC26-PC-Tools.zip is the PC side: unzip it and double-click FC26_Launcher.bat." \
            "SHA-256 (check with: Get-FileHash .\\FC26-PC-Tools.zip -Algorithm SHA256):" \
            "$sums" > notes.md
          gh release create latest FC26-Career-Tracker.apk FC26-PC-Tools.zip SHA256SUMS.txt \
            --title "Latest build" \
            --notes-file notes.md \
            --prerelease --target "$GITHUB_SHA"

  # Pictures of the main screens, drawn on the JVM (Robolectric), kept as a download of the run so a layout can be
  # checked against the design without a phone. Branch builds only, and separate: it never holds up the APK.
  screenshots:
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Draw the screens
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:testDebugUnitTest -Pscreenshots > shots.log 2>&1
          code=$?
          tail -n 40 shots.log
          if [ $code -ne 0 ]; then
            { grep -E "^e: " shots.log | head -80; grep -n -E "FAILED|Exception|Error:" shots.log | head -40; } > errors.txt
            python3 - <<'PY'
          t = open("errors.txt", encoding="utf-8", errors="replace").read()
          t = t.replace("file:///home/runner/work/FC26-Career-Tracker/FC26-Career-Tracker/app/src/", "")
          chunks = [t[i:i + 3500] for i in range(0, min(len(t), 14000), 3500)] or ["(no details)"]
          for n, c in enumerate(chunks):
              c = c.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Screenshots failed ({n + 1}/{len(chunks)})::" + c)
          PY
          fi
          ls -la app/build/screenshots || true
          exit $code
      # Also kept on the ci/screenshots branch (replaced by every run), where they can be fetched with git.
      - name: Publish the pictures to the ci/screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/shots
          cp app/build/screenshots/*.png /tmp/shots/ 2>/dev/null || true
          cp shots.log /tmp/shots/ 2>/dev/null || true
          echo "::notice title=Screenshots::$(cd /tmp/shots && ls -1 | tr '\n' ' ')"
          cd /tmp/shots
          git init -q -b ci/screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            app/build/screenshots/*.png
            shots.log
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  # The Live Editor scripts cannot be run without the game, but their logic is checked here against a pretend
  # database. This job is separate so a problem in it never stops the APK from being built and published.
  lua-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3
      - name: Live Editor script checks
        run: lua5.3 tests/lua/test_transfer_logic.lua

  # The PC bridge (Python and PowerShell versions) is checked against a pretend save: outbox watching, and the
  # match log it builds from the exporter's files. GitHub's Ubuntu image already has PowerShell (pwsh) installed.
  pc-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python bridge checks
        run: |
          python3 tests/bridge/test_outbox_watch.py
          python3 tests/bridge/test_match_log.py
          python3 tests/bridge/test_bridge_status.py
          python3 tests/bridge/test_bridge_auth.py
      - name: PowerShell bridge checks
        run: |
          pwsh -Version
          python3 tests/bridge/test_powershell_importer.py
          python3 tests/bridge/test_powershell_status.py
          python3 tests/bridge/test_powershell_http.py
          python3 tests/bridge/test_powershell_auth.py
      # The launcher is a batch file with a PowerShell program inside. Its functions run on pretend folder layouts
      # (Live Editor and the bridge in different places, several Live Editors, old scripts, a bridge already running),
      # and the whole launcher runs once against the real bridge.
      - name: Launcher checks
        run: |
          set +e
          python3 tests/launcher/test_launcher.py > launcher.log 2>&1
          code=$?
          tail -n 60 launcher.log
          if [ $code -ne 0 ]; then
            python3 - <<'PY'
          t = open("launcher.log", encoding="utf-8", errors="replace").read()
          i = t.find("FAIL:")
          t = (t[i:] if i >= 0 else t[-3000:])[:3800]
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Launcher checks failed::" + t)
          PY
          fi
          exit $code
